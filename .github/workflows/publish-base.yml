# Publish the fork's production base image to the org's private ghcr.
# The deployment kit (paperclip-flux) pins this image as its PAPERCLIP_IMAGE base; each repo
# publishes with its own GITHUB_TOKEN — no shared credentials anywhere.
name: publish-base
on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.repository == 'QualityLabsEU/paperclip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the production base (amd64, single manifest)
        run: |
          set -euo pipefail
          TAG="ghcr.io/qualitylabseu/paperclip-fork"
          docker buildx build --platform linux/amd64 --provenance=false --target production \
            -t "$TAG:base-${GITHUB_SHA::10}" -t "$TAG:base-latest" --push .
